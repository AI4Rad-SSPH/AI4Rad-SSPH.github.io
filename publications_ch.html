  <script>
  (function () {
    Promise.all([
      fetch('data/publications/manifest.json?v=20261121c').then(function (r) { if (!r.ok) throw new Error('manifest'); return r.json(); }),
      fetch('data/team.json?v=20261121c').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
    ]).then(function (res) {
      var papers = res[0], team = res[1] || {};
      papers = papers.filter(function (p) { return p.lab !== false; });
      var names = {};
      var members = {};
      ['leader', 'pi', 'postdoc', 'phd_engineering', 'phd_medical',
       'master_engineering', 'master_medical', 'honors_students', 'alumni'].forEach(function (cat) {
        (team[cat] || []).forEach(function (m) {
          names[m.id] = m.name_cn;
          members[m.id] = { en: m.name_en, cn: m.name_cn };
        });
      });
      var memberNameById = function (id) { return names[id]; };
      window.Pub.initFilter('pub-root', papers, 'cn', memberNameById, { members: members });
    }).catch(function (e) {
      document.querySelector('#pub-root .pub-list').innerHTML =
        '<li class="pub-empty">加载论文列表失败，请刷新重试。</li>';
      console.error(e);
    });
  })();
  </script>
